:root{--ui:'Fredoka','Baloo 2','Nunito','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;--ink:#14204a;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2f7a;font-family:var(--ui);color:#fff;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{display:block}
#bg,#fx{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
#fx{pointer-events:none;z-index:50}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));opacity:0;pointer-events:none;transform:scale(1.03);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.25,1.2);z-index:5}
.screen.on{opacity:1;pointer-events:auto;transform:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
/* ---------- title ---------- */
#title{justify-content:center;gap:clamp(10px,2.4vh,22px)}
.logo{position:relative;text-align:center;line-height:.82;margin-top:-2vh}
.logo .iq{font-size:clamp(84px,20vw,150px);font-weight:700;letter-spacing:-2px;color:var(--gold);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 14px 26px rgba(0,0,0,.35);
  display:inline-block;transform:rotate(-4deg);animation:bob 3.2s ease-in-out infinite}
.logo .lines{font-size:clamp(46px,11vw,82px);font-weight:700;letter-spacing:6px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 12px 24px rgba(0,0,0,.35);display:block;margin-top:2px}
.tagline{font-size:clamp(15px,3.8vw,19px);font-weight:500;opacity:.92;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,20,80,.5)}
@keyframes bob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}
#demoWrap{position:relative;overflow:hidden;width:min(70vw,42vh,330px);aspect-ratio:1;border-radius:9%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 22px 50px rgba(0,10,60,.55),inset 0 -6px 0 rgba(20,40,110,.08)}
#demoWrap canvas{width:100%;height:100%}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;border-radius:999px;transition:transform .12s ease,filter .2s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.primary{font-size:clamp(24px,6vw,30px);padding:14px 56px 16px;color:#5a2a00;letter-spacing:1px;
  background:linear-gradient(180deg,#fff3a0 0%,#ffd23f 40%,#ff9f1a 100%);box-shadow:0 6px 0 #c25e00,0 14px 28px rgba(80,30,0,.45),inset 0 2px 0 rgba(255,255,255,.8);text-shadow:0 1px 0 rgba(255,255,255,.6);animation:pulse 2.2s ease-in-out infinite}
.btn.primary:active{box-shadow:0 2px 0 #c25e00,0 6px 14px rgba(80,30,0,.4),inset 0 2px 0 rgba(255,255,255,.8)}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08) drop-shadow(0 0 14px rgba(255,210,63,.65))}}
.btn.glass{font-size:18px;padding:11px 26px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));border:1.5px solid rgba(255,255,255,.45);box-shadow:0 6px 18px rgba(0,20,80,.35),inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.starTotal{font-weight:600;font-size:16px;opacity:.95;display:flex;align-items:center;gap:6px}
/* ---------- top bars ---------- */
.topbar{width:100%;max-width:620px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.45);box-shadow:0 5px 14px rgba(0,20,80,.35),inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s}
.icon:active{transform:scale(.92)}
.rgrp{display:flex;gap:8px}
.icon.off{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05))}
#game .pill{max-width:calc(100vw - 190px);font-size:14px;padding:8px 12px}
.icon svg{width:24px;height:24px}
.pill{padding:8px 16px;border-radius:999px;background:rgba(5,25,85,.45);border:1.5px solid rgba(255,255,255,.25);font-weight:600;font-size:15px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill b{color:var(--gold)}
/* ---------- level select ---------- */
#select h2{margin:0;font-size:26px;font-weight:700;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
#grid{flex:1;width:100%;max-width:620px;overflow-y:auto;padding:18px 4px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start;scrollbar-width:none}
#grid::-webkit-scrollbar{display:none}
.lv{position:relative;aspect-ratio:1/1.08;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#ffffff 0%,#e8f0ff 100%);color:var(--ink);box-shadow:0 6px 0 #9fb4e6,0 12px 22px rgba(0,20,80,.35);transition:transform .15s;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.lv:active{transform:translateY(3px)}
.lv .n{font-size:clamp(24px,6.5vw,34px);font-weight:700;line-height:1}
.lv .q{font-size:11px;font-weight:600;color:#5a6ea8;letter-spacing:.3px}
.lv .st{display:flex;gap:1px;margin-top:2px}
.lv .st svg{width:15px;height:15px}
.lv.cur{background:linear-gradient(180deg,#fff7c2 0%,#ffd23f 100%);box-shadow:0 6px 0 #d38a00,0 0 0 4px rgba(255,255,255,.7),0 12px 26px rgba(80,40,0,.4)}
.lv.lock{background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.1));color:rgba(255,255,255,.7);box-shadow:0 6px 0 rgba(0,20,80,.35),inset 0 1px 0 rgba(255,255,255,.4);cursor:default}
.lv.lock .q{color:rgba(255,255,255,.8)}
.lv.lock svg.lk{width:28px;height:28px;opacity:.85}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* ---------- game ---------- */
#game{gap:6px}
.iqBadge{font-size:clamp(40px,10.5vw,62px);font-weight:700;line-height:1;color:#ffe43a;-webkit-text-stroke:4px #10183b;paint-order:stroke fill;text-shadow:0 4px 0 #10183b,0 10px 22px rgba(0,0,0,.35);margin-top:4px;letter-spacing:1px;transition:transform .3s}
.iqBadge.bump{animation:bump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tip{font-size:clamp(14px,3.6vw,17px);font-weight:500;opacity:.95;text-shadow:0 2px 6px rgba(0,20,80,.6);min-height:22px;text-align:center}
#boardWrap{position:relative;border-radius:7%;background:#fff;margin-top:auto;flex-shrink:0;
  box-shadow:0 0 0 5px rgba(255,255,255,.35),0 24px 60px rgba(0,10,60,.55),0 6px 0 rgba(10,30,100,.25);touch-action:none}
#boardWrap::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(20,40,110,.08),inset 0 -10px 24px rgba(30,60,140,.06)}
#board{width:100%;height:100%;border-radius:inherit;touch-action:none;cursor:crosshair}
#boardWrap.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px) rotate(-.6deg)}40%,60%{transform:translateX(9px) rotate(.6deg)}}
#boardWrap.won{animation:won .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes won{30%{transform:scale(1.04)}100%{transform:scale(1)}}
.pips{display:flex;gap:10px;margin-top:10px;min-height:22px}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);transition:all .3s cubic-bezier(.2,1.6,.4,1)}
.pip.on{transform:scale(1.15);border-color:#fff;box-shadow:0 0 12px currentColor}
.toolbar{display:flex;gap:14px;margin-top:auto;padding-top:8px}
.logo .iq::after{content:'';}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;letter-spacing:.3px;background:none}
.tool .ic{width:62px;height:62px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(180deg,#ffffff,#dfe8ff);color:var(--ink);box-shadow:0 5px 0 #8fa6dc,0 10px 22px rgba(0,20,80,.35);transition:transform .12s}
.tool:active .ic{transform:translateY(3px);box-shadow:0 2px 0 #8fa6dc,0 6px 12px rgba(0,20,80,.3)}
.tool .ic svg{width:30px;height:30px}
.tool.hint .ic{background:linear-gradient(180deg,#fff6b5,#ffd23f);box-shadow:0 5px 0 #d38a00,0 10px 22px rgba(80,40,0,.35);color:#6a3b00}
.tool.hint:active .ic{box-shadow:0 2px 0 #d38a00}
/* ---------- win overlay ---------- */
#win{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(10,30,100,.35),rgba(3,10,40,.75));opacity:0;pointer-events:none;transition:opacity .35s}
#win.on{opacity:1;pointer-events:auto}
.card{width:min(88vw,380px);border-radius:32px;padding:26px 22px 22px;text-align:center;color:var(--ink);background:linear-gradient(180deg,#ffffff 0%,#eef3ff 100%);

// Render N seconds offline -> AudioBuffer (used for preview/testing)
async function renderMusicOffline(mood = 'game', seconds = 20, sr = 44100) {
  const ac = new OfflineAudioContext(2, Math.floor(sr * seconds), sr);
  const g = ac.createGain(); g.gain.value = Music.vol; g.connect(ac.destination);
  g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(Music.vol, 2); g.gain.setValueAtTime(Music.vol, seconds - 2.5); g.gain.linearRampToValueAtTime(0, seconds);

  while (t < seconds - 2) { E.schedule(step, t + ((step % 2) ? (E.song.swing - .5) * 2 * six : 0), six); t += six; step++; }

}

// ======================= game state =======================
const G = {
  li: 0, level: null, paths: [], drawing: null, failing: null, hint: null, pulses: {}, erasing: [],
  history: [], hintUsed: false, fails: 0, won: 0, intro: 0, ptr: null, tap: null, boardPx: 300,
};
const cv = $('board'), ctx = cv.getContext('2d');
function show(id) { Music.setMood(id === 'game' ? 'game' : 'title'); document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); if (id !== 'game') fx.pencil = null; if (id === 'select') buildGrid(); if (id === 'title') updateTitle(); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1600); }

function layoutBoard() {
  const wrap = $('boardWrap');
  const topH = 48 + 60 + 26 + 30, botH = 32 + 100;
  const avail = innerHeight - topH - botH - 24;
  const px = Math.floor(clamp(Math.min(innerWidth - 32, avail), 220, 600));
  G.boardPx = px; wrap.style.width = wrap.style.height = px + 'px';
  const d = DPR(); cv.width = px * d; cv.height = px * d;
  const dw = $('demoWrap'), dc = $('demo'), dpx = dw.clientWidth || 300; dc.width = dpx * d; dc.height = dpx * d; demo.px = dpx;
}
function startLevel(i) {
  G.li = i; G.level = LEVELS[i]; G.paths = G.level.pairs.map(() => null); G.drawing = null; G.failing = null; G.hint = null; G.pulses = {}; G.erasing = [];
  G.history = []; G.hintUsed = false; G.fails = 0; G.won = 0; G.intro = performance.now();

  const b = $('iqBadge'); b.textContent = `IQ = ${G.level.iq}`; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  $('tip').textContent = G.level.tip || '';

  $('boardWrap').classList.remove('won');

}
function updatePips() { [...$('pips').children].forEach((el, i) => { const on = !!G.paths[i]; el.classList.toggle('on', on); el.style.background = on ? COLORS[G.level.pairs[i].c].base : ''; }); }
function snapshot() { G.history.push(G.paths.map(p => p ? p.pts.slice() : null)); if (G.history.length > 60) G.history.shift(); }
function toBoard(e) { const r = cv.getBoundingClientRect(); return pt((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100); }

function dotAt(p, tol) { let best = null, bd = 1e9; G.level.pairs.forEach((pr, i) => [pr.a, pr.b].forEach((d, e) => { const dd = Math.hypot(d[0] - p.x, d[1] - p.y); if (dd < tol && dd < bd) { bd = dd; best = { pair: i, end: e }; } })); return best; }

function erasePath(i, withSnap = true) { if (!G.paths[i]) return; if (withSnap) snapshot(); G.erasing.push({ pts: G.paths[i].pts, pair: i, t0: performance.now() }); G.paths[i] = null; delete G.pulses[i]; updatePips(); }
function setPencil(e) { const sc = clamp(G.boardPx / 620, .45, .8); fx.pencil = { x: e.clientX, y: e.clientY, s: sc, a: -0.62 }; }

function onDown(e) {
  if (G.won) return;
  Sfx.init();
  e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  const p = toBoard(e); G.ptr = e.pointerId;
  const d = dotAt(p, R + 3.2);
  if (d) {
    const had = !!G.paths[d.pair];
    if (had) erasePath(d.pair); else snapshot();
    const src = G.level.pairs[d.pair][d.end ? 'b' : 'a'];
    G.drawing = { pair: d.pair, from: d.end, pts: [pt(src[0], src[1])], len: 0, erased: had };

}
function onMove(e) {

  e.preventDefault();

}
function extendTo(p) {
  const D = G.drawing, pts = D.pts, last = pts[pts.length - 1];
  const d = dist(last, p); if (d < 0.7) return;

      if (c) return fail(c);

    const c = checkSeg(G.level, D.pair, prev, q, others);

}
function onUp(e) {

  fx.pencil = null;
  const D = G.drawing; G.drawing = null; if (!D.erased) G.history.pop();

}
function fail(c) {

function commit() {

function win() {

const PRAISE = ['Genius!', 'Brilliant!', 'Big Brain!', 'Einstein!', 'Mastermind!', 'Superb!'];
function showWin(stars) {
  $('winTitle').textContent = G.li === LEVELS.length - 1 ? 'Legend!' : PRAISE[G.li % PRAISE.length];
  $('winSub').textContent = `Level ${G.li + 1} · ${G.level.name}`;
  $('bigStars').innerHTML = [0, 1, 2].map(k => STAR(k < stars)).join('');
  $('winIq').innerHTML = `<small>YOUR IQ</small> ${G.level.iq}`;

  $('win').classList.add('on');

function hideWin() { $('win').classList.remove('on'); }
function undo() {

  const h = G.history.pop(); if (!h) { toast('Nothing to undo'); return; }
  G.paths.forEach((p, i) => { if (p && !h[i]) G.erasing.push({ pts: p.pts, pair: i, t0: performance.now() }); });
  G.paths = h.map(p => p ? mkPath(p) : null); updatePips();

// ---------------- title demo ----------------
const demo = { cv: $('demo'), ctx: null, px: 300, t0: performance.now() };
demo.ctx = demo.cv.getContext('2d');
function renderDemo(now) {
  const L = LEVELS[2], sol = L._sol; if (!sol) return;
  const cycle = 7600, t = (now - demo.t0) % cycle;
  const order = sol.order, per = 1500, view = { paths: L.pairs.map(() => null), pulses: {}, now, erasing: [] };
  let pencil = null;
  order.forEach((k, j) => {
    const st = 500 + j * (per + 250), p = sol.paths[k];
    if (t > st + per) { view.paths[k] = { pts: p }; view.pulses[k] = demo.t0 + Math.floor((now - demo.t0) / cycle) * cycle + st + per; }
    else if (t > st) { const n = Math.max(2, Math.floor(ease.out((t - st) / per) * p.length)); view.drawing = { pair: k, from: 0, pts: p.slice(0, n) }; pencil = p[n - 1]; }
  });
  if (t > cycle - 900) view.won = demo.t0 + Math.floor((now - demo.t0) / cycle) * cycle + cycle - 900;
  renderBoard(demo.ctx, demo.px, L, view);
  if (pencil) { const d = DPR(), s = demo.px / 100; demo.ctx.setTransform(d, 0, 0, d, 0, 0); drawPencil(demo.ctx, pencil.x * s, pencil.y * s, clamp(demo.px / 1000, .25, .4)); }
}
function updateTitle() { const ts = totalStars(); $('starTotal').innerHTML = `<span style="display:inline-block;width:20px;height:20px">${STAR(true)}</span> ${ts} / ${LEVELS.length * 3}`; $('playBtn').textContent = save.unlocked > 1 ? `PLAY · ${Math.min(save.unlocked, LEVELS.length)}` : 'PLAY'; }
function buildGrid() {

    return `<button class="lv${cur ? ' cur' : ''}" data-lv="${i}" style="animation-delay:${i * 22}ms"><span class="n">${i + 1}</span><span class="q">IQ ${L.iq}</span><span class="st">${[0, 1, 2].map(k => STAR(k < st)).join('')}</span></button>`;
